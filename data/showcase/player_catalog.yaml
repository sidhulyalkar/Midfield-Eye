version: 2
updated_at: '2026-07-28'
title: 100 Elite Midfielder Study Atlas
purpose: A balanced, non-ordinal research cohort of 100 elite midfield and midfield-adjacent creators. Qualitative
  signatures and emphasis values are editorial hypotheses for interface and experiment design, never measured player
  ratings.
ranking_policy: The phrase top 100 is implemented as a curated 100-player study cohort, not an objective ordinal
  ranking. The frontend must not display rank numbers.
cohort_balance:
  men's game: 50
  women's game: 50
source_anchors:
- name: ESPN FC 100 2025
  url: https://espnpressroom.com/press-release/espn-com-announce-the-2025-fc-100-list-ranking-the-best-players-in-mens-soccer/
  scope: Recent elite men’s positional recognition; used as one selection anchor, not copied as a ranking.
- name: The Best FIFA Football Awards 2025
  url: https://www.fifa.com/en/articles/shortlist-voting-phase-now-open
  scope: Recent women’s and men’s elite recognition.
- name: UEFA Champions League Teams of the Season 2024/25 and 2025/26
  url: https://www.uefa.com/uefachampionsleague/news/
  scope: Recent technical-observer recognition and tactical context.
- name: UEFA Women’s Champions League Teams of the Season 2024/25 and 2025/26
  url: https://www.uefa.com/womenschampionsleague/news/
  scope: Recent technical-observer recognition and tactical context.
players:
- id: rodri
  name: Rodri
  cohort: men's game
  display_role: Single pivot / controlling midfielder
  primary_archetype: press_resistant_controller
  signature: Creates order before receiving, using positioning and first-touch direction to keep progression and
    transition security alive.
  talent_lenses:
  - pre-reception structure
  - tempo regulation
  - rest-defense control
  - pressure escape
  adaptation_lenses:
  - teammate-response timing
  - opponent displacement
  - role switching
  - support reciprocity
  gaze_lenses:
  - pre-reception scans
  - head-body dissociation
  - relevant-space acquisition
  - gaze-to-action latency
  body_mechanics_lenses:
  - open-body access
  - weight-transfer proxy
  - braking and turning load
  - multi-action readiness
  orchestration_lenses:
  - tempo change
  - network brokerage
  - option enablement
  - directive influence
  physical_lenses:
  - acceleration access
  - contact or balance demands
  - repeat movement
  - execution envelope
  study_questions:
  - How does Rodri's scanning change the option menu before receiving?
  - Which teammate movements amplify or constrain the press resistant controller role?
  - When do body orientation and weight transfer preserve multiple actions from one posture?
