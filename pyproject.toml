[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midfielders-eye"
version = "0.6.0"
description = "Empirical soccer perception atlas with governed datasets, direct-gaze adapters, pose/biomechanics ingestion, tactical affordance fields, and evidence-aware showcase tooling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
annotation = ["streamlit>=1.36", "plotly>=5.22"]
providers = ["kloppy>=3.19", "fsspec>=2024.6"]
showcase = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
parquet = ["pyarrow>=15.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
all = [
  "streamlit>=1.36",
  "plotly>=5.22",
  "kloppy>=3.19",
  "fsspec>=2024.6",
  "pyarrow>=15.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
midfielders-eye = "midfielders_eye.cli:app"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"midfielders_eye.showcase" = ["*.yaml"]
"midfielders_eye.empirical" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
